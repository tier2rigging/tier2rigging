<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Tier2 Rigging LLC</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1c1c1e; --card:#252527; --tan:#c8a96e; --tan-light:#e0c080;
    --parchment:#f2ede4; --muted:#9a9890; --border:rgba(200,185,150,0.2);
    --input-bg:#161618; --success:#4a9e6a; --danger:#e07070;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--parchment);font-family:'Barlow',sans-serif;min-height:100vh;}

  /* ── HEADER ── */
  .site-header{display:flex;align-items:center;gap:14px;padding:18px 24px 0;flex-wrap:wrap;}
  .site-header img{height:54px;}
  .site-header .brand{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--parchment);}
  .site-header .brand span{color:var(--tan-light);}

  /* ── NAV ── */
  .site-nav{display:flex;align-items:center;gap:0;padding:10px 24px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .nav-link{display:flex;align-items:center;gap:6px;padding:10px 18px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;transition:color 0.2s,border-color 0.2s;white-space:nowrap;}
  .nav-link:hover{color:#e0c080;border-bottom-color:rgba(200,169,110,0.4);}
  .nav-link.active{color:#e0c080;border-bottom-color:#c8a96e;}
  .nav-link svg{width:13px;height:13px;flex-shrink:0;opacity:0.75;}
  .nav-link:hover svg,.nav-link.active svg{opacity:1;}
  .nav-divider{width:1px;height:20px;background:rgba(200,169,110,0.15);flex-shrink:0;}
  .nav-link.admin-link{color:#7a7a7a;font-size:13px;letter-spacing:1.5px;}
  .nav-link.admin-link:hover{color:#9a9890;border-bottom-color:rgba(154,152,144,0.3);}
  @media(max-width:480px){
    .nav-link{padding:10px 14px;font-size:13px;letter-spacing:1.5px;}
    .nav-divider{display:none;}
  }

  /* ── CONTENT ── */
  .wrap{max-width:520px;margin:0 auto;padding:40px 20px 80px;}

  .page-label{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;color:var(--tan);margin-bottom:4px;}
  .page-title{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:2px;color:var(--parchment);margin-bottom:24px;line-height:1.1;}

  .contact-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px 28px;margin-bottom:20px;}

  .contact-row{display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid rgba(200,185,150,0.1);}
  .contact-row:last-child{border-bottom:none;padding-bottom:0;}
  .contact-row:first-child{padding-top:0;}

  .contact-icon{width:44px;height:44px;border-radius:10px;background:rgba(200,169,110,0.1);border:1px solid rgba(200,169,110,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;}

  .contact-info{flex:1;}
  .contact-label{font-family:'Barlow',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--tan);margin-bottom:4px;}
  .contact-value a{color:var(--parchment);text-decoration:none;font-size:17px;font-weight:500;transition:color 0.2s;}
  .contact-value a:hover{color:var(--tan-light);}

  .contact-note{font-size:13px;color:var(--muted);line-height:1.6;margin-top:20px;text-align:center;}
</style>
</head>
<body>

<div class="site-header">
  <img src="/icon-192x192.png" alt="Tier2 Rigging" onerror="this.style.display='none'">
  <div class="brand">TIER<span>2</span> RIGGING</div>
</div>

<nav class="site-nav">
  <a class="nav-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6M9 16h6M9 8h6M5 20h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/></svg>
    Service Request
  </a>
  <div class="nav-divider"></div>
  <a class="nav-link" href="customer.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    My Rig Portal
  </a>
  <div class="nav-divider"></div>
  <a class="nav-link active" href="contact.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    Contact
  </a>
  <div class="nav-divider"></div>
  <a class="nav-link admin-link" href="admin.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Admin
  </a>
</nav>

<div class="wrap">
  <div class="page-label">TIER2 RIGGING LLC</div>
  <div class="page-title">Contact Us</div>

  <div class="contact-card">
    <div class="contact-row">
      <div class="contact-icon">📧</div>
      <div class="contact-info">
        <div class="contact-label">Email</div>
        <div class="contact-value"><a href="mailto:Tier2riggingservices@gmail.com">Tier2riggingservices@gmail.com</a></div>
      </div>
    </div>
    <div class="contact-row">
      <div class="contact-icon">📱</div>
      <div class="contact-info">
        <div class="contact-label">Phone / Text</div>
        <div class="contact-value"><a href="tel:+15169028843">(516) 902-8843</a></div>
      </div>
    </div>
  </div>

  <div class="contact-note">
    Reach out anytime — we'll get back to you as soon as possible.
  </div>
</div>

</body>
</html>
